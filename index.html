<!doctype html><meta charset="utf-8"><title>SafeMy</title><style>body{margin:0;background:#f5f5f7;font:14px system-ui;color:#1d1d1f}.app{display:grid;grid-template-columns:210px 1fr;max-width:1100px;margin:30px auto;background:#fff;border:1px solid #e5e5e8;border-radius:18px;overflow:hidden;min-height:650px}aside{background:#fbfbfc;border-right:1px solid #eee;padding:22px 14px}.brand{font-size:21px;font-weight:600;padding:0 10px 24px}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;color:#666;cursor:pointer}nav button.active,nav button:hover{background:#eaf1ff;color:#1769e0}.section{font-size:11px;color:#999;text-transform:uppercase;margin:24px 12px 8px}main{padding:32px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:29px}.sub{color:#888;margin-top:6px}.add,.save{background:#1769e0;color:#fff;border:0;border-radius:9px;padding:11px 15px;cursor:pointer}.toolbar{display:flex;gap:10px;margin:26px 0 20px}input,select,textarea{padding:11px;border:1px solid #dddde3;border-radius:9px;background:#f1f1f3;font-size:14px;box-sizing:border-box;width:100%;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid #e8e8ec;border-radius:12px;overflow:hidden;position:relative}.thumb{height:110px;background:#dce8ff;display:grid;place-items:center;font-size:32px;color:#1769e0}.body{padding:13px;cursor:pointer}.title{font-weight:600}.domain{color:#999;margin-top:6px;font-size:12px}.tag{display:inline-block;margin-top:10px;background:#edf4ff;color:#1769e0;padding:5px 7px;border-radius:5px;font-size:11px}.edit{position:absolute;right:8px;top:8px;border:0;border-radius:7px;background:#fff;padding:6px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#0005;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{background:#fff;padding:25px;border-radius:15px;width:min(400px,90%)}.cancel{border:0;background:#eee;border-radius:9px;padding:11px 15px;margin-left:8px}@media(max-width:700px){.app{margin:0;border-radius:0;grid-template-columns:1fr}aside{display:none}main{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}header{align-items:flex-start;gap:15px;flex-direction:column}.add{width:100%}}</style><div class="app"><aside><div class="brand">SafeMy</div><nav><button class="active" data-cat="Все материалы">⌂　Все материалы</button><button data-cat="Instagram">◎　Instagram</button><button data-cat="Behance">◈　Behance</button><button data-cat="Dprofile">◉　Dprofile</button><div class="section">Система</div><button>⚙　Настройки</button></nav></aside><main><header><div><h1 id="heading">Все материалы</h1><div class="sub">Сохранённые карточки</div></div><button class="add" id="add">＋ Добавить ссылку</button></header><div class="toolbar"><input id="search" placeholder="Поиск по ссылкам и тегам"></div><div class="grid" id="grid"></div></main></div><div class="modal" id="modal"><div class="dialog"><h2 id="mt">Добавить карточку</h2><input id="name" placeholder="Название"><textarea id="desc" placeholder="Описание"></textarea><input id="url" placeholder="Ссылка"><button class="save" id="getPreview" type="button">Получить превью</button><p id="previewStatus" class="domain"></p><input id="preview" placeholder="URL изображения превью"><input id="tag" placeholder="Тег без #"><select id="cat"><option>Instagram</option><option>Behance</option><option>Dprofile</option></select><button class="save" id="save">Сохранить</button><button class="cancel" id="cancel">Отмена</button></div></div><script>const base=[{c:'Instagram',n:'Minimal interior inspiration',d:'',u:'https://instagram.com',p:'',t:'interior'},{c:'Behance',n:'Brand identity — case study',d:'',u:'https://behance.net',p:'',t:'branding'},{c:'Dprofile',n:'Digital product showcase',d:'',u:'https://dprofile.ru',p:'',t:'product'}],items=JSON.parse(localStorage.getItem('safemy-full')||'[]'),$=x=>document.getElementById(x),grid=$('grid'),heading=$('heading');let edit=-1;function render(){let q=$('search').value.toLowerCase(),cat=heading.textContent,all=[...items,...base];grid.innerHTML=all.filter(x=>(cat==='Все материалы'||x.c===cat)&&(x.n+' '+x.u+' '+x.t).toLowerCase().includes(q)).map((x,i)=>`<div class="card"><button class="edit" onclick="editCard(${i})">✎</button><div class="thumb" style="${x.p?'background:url('+x.p+') center/cover':''}">${x.p?'':'◉'}</div><div class="body" onclick="window.open('${x.u}','_blank')"><div class="title">${x.n}</div><div class="domain">${x.u}</div><span class="tag">#${x.t||'new'}</span></div></div>`).join('')}window.editCard=i=>{let x=[...items,...base][i];edit=items.indexOf(x);$('mt').textContent='Редактировать карточку';$('name').value=x.n;$('desc').value=x.d||'';$('url').value=x.u;$('preview').value=x.p||'';$('tag').value=x.t||'';$('cat').value=x.c;$('modal').classList.add('open')};$('add').onclick=()=>{edit=-1;$('mt').textContent='Добавить карточку';['name','desc','url','preview','tag'].forEach(id=>$(id).value='');$('modal').classList.add('open')};$('cancel').onclick=()=>$('modal').classList.remove('open');$('save').onclick=()=>{let x={c:$('cat').value,n:$('name').value.trim()||'Новая карточка',d:$('desc').value.trim(),u:$('url').value.trim(),p:$('preview').value.trim(),t:$('tag').value.trim()};if(!/^https?:\/\//i.test(x.u))return alert('Введите корректную ссылку');if(edit<0)items.unshift(x);else items[edit]=x;localStorage.setItem('safemy-full',JSON.stringify(items));$('modal').classList.remove('open');render()};document.querySelectorAll('nav button[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');heading.textContent=b.dataset.cat;render()});$('search').oninput=render;$('getPreview').onclick=async()=>{const u=$('url').value.trim();if(!/^https?:\\/\\//i.test(u))return $('previewStatus').textContent='Сначала вставьте корректную ссылку';$('previewStatus').textContent='Получаю превью…';try{const r=await fetch('/api/preview?url='+encodeURIComponent(u));const m=await r.json();$('name').value=m.title||m.domain;$('desc').value=m.description||'';$('preview').value=m.image||'';$('previewStatus').textContent=m.image?'Превью получено':'Данные получены, изображение недоступно — его можно добавить вручную'}catch(e){$('previewStatus').textContent='Не удалось получить превью — заполните данные вручную'}};render()</script>
