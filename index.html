<!doctype html><meta charset="utf-8"><title>SafeMy</title><style>body{font:14px system-ui;max-width:760px;margin:30px auto;background:#f5f5f7;color:#202124}.box{background:white;padding:28px;border:1px solid #ddd;border-radius:16px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #ddd}button{background:#1769e0;color:#fff;border:0;cursor:pointer}.preview{display:none;border:1px solid #ddd;border-radius:12px;margin-top:20px;overflow:hidden}.preview img{width:100%;max-height:260px;object-fit:cover}.inside{padding:16px}.muted{color:#777}</style><div class="box"><h1>SafeMy</h1><p class="muted">Добавьте ссылку и проверьте карточку перед сохранением.</p><input id="url" placeholder="https://behance.net/..."><button id="previewBtn">Получить превью</button><div class="preview" id="preview"><img id="image"><div class="inside"><input id="title" placeholder="Название"><textarea id="description" placeholder="Описание"></textarea><input id="tag" placeholder="Тег"><select id="category"><option>Instagram</option><option>Behance</option><option>Dprofile</option></select><button id="save">Сохранить карточку</button></div></div><p id="status" class="muted"></p></div><script>const $=id=>document.getElementById(id);let result=null;$('previewBtn').onclick=async()=>{const url=$('url').value.trim();if(!/^https?:\/\//i.test(url))return $('status').textContent='Введите корректную ссылку';$('status').textContent='Получаю превью…';try{const r=await fetch('/api/preview?url='+encodeURIComponent(url));result=await r.json();$('title').value=result.title||result.domain;$('description').value=result.description||'';$('image').src=result.image||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260"><rect width="100%" height="100%" fill="%23dce8ff"/><text x="50%" y="50%" text-anchor="middle" fill="%231769e0" font-size="32">SafeMy</text></svg>';$('preview').style.display='block';$('status').textContent='Проверьте данные и сохраните карточку.'}catch(e){$('status').textContent='Превью недоступно — заполните данные вручную.'}};$('save').onclick=()=>{$('status').textContent='Карточка сохранена (после подключения Supabase она будет синхронизироваться между устройствами).'};</script>
