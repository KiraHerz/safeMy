<!doctype html>
<meta charset="utf-8">
<title>SafeMy — Хобби</title>
<style>
body{margin:0;background:#f5f5f7;font:14px system-ui;color:#1d1d1f}.app{max-width:900px;margin:30px auto;background:#fff;border:1px solid #e5e5e8;border-radius:18px;padding:30px}.top{display:flex;justify-content:space-between;align-items:flex-start}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d8dce4;border-radius:9px;padding:10px 14px;background:#fff;cursor:pointer;font:inherit}.btn.primary{background:#1769e0;color:#fff;border-color:#1769e0}.btn.danger{color:#b42318;border-color:#efb4ae;margin-top:12px}.tabs{margin:22px 0 18px}.insight{background:#f1f6ff;border:1px solid #dce8ff;padding:13px;border-radius:10px;color:#3a5d9e}.stats{display:flex;justify-content:space-between;margin:22px 0 8px}.muted{color:#7d8795;font-size:12px}.bar{height:8px;background:#e8edf5;border-radius:8px}.fill{height:8px;background:#1769e0;border-radius:8px}.stage{border:1px solid #e5e5e8;border-left:4px solid #1769e0;border-radius:10px;padding:14px;margin-top:10px}.stage.done{border-left-color:#32a66a}.stage.locked{border-left-color:#c5ccd7;color:#888}.stage-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{background:#fff;border-radius:15px;padding:24px;width:min(410px,90%);box-shadow:0 12px 40px #0003}.dialog h2{margin-top:0}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:7px 0;border:1px solid #d8dce4;border-radius:9px;background:#f7f7f9;font:inherit}textarea{min-height:70px;resize:vertical}.dialog-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}@media(max-width:600px){.app{margin:0;border-radius:0}.top{flex-direction:column;gap:15px}.actions{width:100%}.actions .btn{flex:1}}
</style>
<div class="app">
<div class="top"><div><button class="btn" id="back">← Сохранённое</button><h1 id="title">Дизайн</h1><div class="muted">Дерево развития навыков</div></div><div class="actions"><button class="btn primary" id="edit">Редактировать хобби</button><button class="btn primary" id="new">＋ Новое хобби</button></div></div>
<div class="tabs" id="tabs"></div>
<div class="insight">💡 Инсайт помощника: следующий этап откроет параллельные ветки.</div>
<div class="stats"><b><span id="xp">0</span> XP<br><span class="muted">Общий опыт</span></b><b>Уровень <span id="level">1</span><br><span class="muted">Уровень</span></b><b><span id="percent">0</span>%<br><span class="muted">Прогресс</span></b></div><div class="bar"><div class="fill" id="fill"></div></div>
<button class="btn primary" id="add" style="margin-top:18px">＋ Добавить этап</button><div id="stages"></div>
</div>
<div class="modal" id="hmodal"><div class="dialog"><h2 id="mh">Новое хобби</h2><input id="hname" placeholder="Название хобби"><div class="dialog-actions"><button class="btn primary" id="hsave">Сохранить</button><button class="btn" id="hcancel">Отмена</button></div><button class="btn danger" id="hdelete">Удалить выбранное хобби</button></div></div>
<div class="modal" id="smodal"><div class="dialog"><h2 id="ms">Новый этап</h2><input id="sname" placeholder="Название этапа"><input id="sxp" type="number" min="0" placeholder="Очки опыта"><select id="sstatus"><option>Заблокировано</option><option>В процессе</option><option>Выполнено</option></select><textarea id="snotes" placeholder="Заметки"></textarea><input id="slink" placeholder="Ссылка"><div class="dialog-actions"><button class="btn primary" id="ssave">Сохранить</button><button class="btn" id="scancel">Отмена</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const seed={Дизайн:[{name:'Основы композиции',xp:40,status:'Выполнено',notes:'',link:''},{name:'Типографика',xp:60,status:'В процессе',notes:'',link:''},{name:'Айдентика',xp:90,status:'Заблокировано',notes:'',link:''}],Фотография:[]};
let data=JSON.parse(localStorage.getItem('safemy-hobbies-data')||'null')||seed;let active=localStorage.getItem('safemy-active-hobby')||Object.keys(data)[0]||'Дизайн';let editingStage=-1;
function persist(){localStorage.setItem('safemy-hobbies-data',JSON.stringify(data));localStorage.setItem('safemy-active-hobby',active)}
function renderTabs(){$('tabs').innerHTML=Object.keys(data).map(n=>'<button class="btn '+(n===active?'primary':'')+'" data-h="'+n+'">'+n+'</button>').join('');$('tabs').querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{active=b.dataset.h;persist();render()})}
function render(){if(!data[active])active=Object.keys(data)[0];$('title').textContent=active;renderTabs();let stages=data[active].stages||[];let xp=stages.filter(s=>s.status==='Выполнено').reduce((a,s)=>a+Number(s.xp||0),0);let done=stages.filter(s=>s.status==='Выполнено').length;let pct=stages.length?Math.round(done/stages.length*100):0;$('xp').textContent=xp;$('level').textContent=Math.max(1,Math.floor(xp/100)+1);$('percent').textContent=pct;$('fill').style.width=pct+'%';$('stages').innerHTML=stages.map((s,i)=>'<div class="stage '+(s.status==='Выполнено'?'done ':'')+(s.status==='Заблокировано'?'locked':'')+'"><div class="stage-head"><b>'+(s.status==='Выполнено'?'✓ ':s.status==='В процессе'?'◉ ':'◌ ')+s.name+'</b><button class="btn" data-edit-stage="'+i+'">Редактировать</button></div><div class="muted">'+s.status+' · +'+(s.xp||0)+' XP'+(s.notes?' · '+s.notes:'')+(s.link?' · ссылка прикреплена':'')+'</div></div>').join('');$('stages').querySelectorAll('[data-edit-stage]').forEach(b=>b.onclick=()=>openStage(Number(b.dataset.editStage)))}
function openStage(i){editingStage=i;let s=data[active].stages[i]||{name:'',xp:50,status:'Заблокировано',notes:'',link:''};$('ms').textContent=i<0?'Новый этап':'Редактировать этап';$('sname').value=s.name;$('sxp').value=s.xp;$('sstatus').value=s.status;$('snotes').value=s.notes||'';$('slink').value=s.link||'';$('smodal').classList.add('open')}
$('back').onclick=()=>location.href='/';$('new').onclick=()=>{$('mh').textContent='Новое хобби';$('hname').value='';$('hdelete').style.display='none';$('hmodal').classList.add('open')};$('edit').onclick=()=>{$('mh').textContent='Редактировать хобби';$('hname').value=active;$('hdelete').style.display='block';$('hmodal').classList.add('open')};$('hcancel').onclick=()=> $('hmodal').classList.remove('open');$('hsave').onclick=()=>{let n=$('hname').value.trim();if(!n)return;if($('mh').textContent==='Новое хобби'){if(data[n])return;data[n]={stages:[]};active=n}else{if(n!==active){data[n]=data[active];delete data[active];active=n}}persist();$('hmodal').classList.remove('open');render()};$('hdelete').onclick=()=>{let names=Object.keys(data);if(names.length<2)return;delete data[active];active=Object.keys(data)[0];persist();$('hmodal').classList.remove('open');render()};$('add').onclick=()=>openStage(-1);$('scancel').onclick=()=> $('smodal').classList.remove('open');$('ssave').onclick=()=>{let n=$('sname').value.trim();if(!n)return;let s={name:n,xp:Number($('sxp').value||0),status:$('sstatus').value,notes:$('snotes').value.trim(),link:$('slink').value.trim()};if(editingStage<0)data[active].stages.push(s);else data[active].stages[editingStage]=s;persist();$('smodal').classList.remove('open');render()};render();
</script>
